<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Telegram Data</title>
    <style>
      body {
        font-family: monospace;
        padding: 20px;
        background: #f5f5f5;
      }
      .data {
        background: white;
        padding: 15px;
        border-radius: 8px;
        border: 1px solid #ddd;
        white-space: pre-wrap;
        max-height: 400px;
        overflow: auto;
      }
      h3 {
        margin-top: 20px;
      }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <h1>Telegram App Data</h1>

    <h3>WebApp Object:</h3>
    <div id="webapp" class="data"></div>

    <h3>User Data:</h3>
    <div id="user" class="data"></div>

    <h3>Backend Response:</h3>
    <div id="backend" class="data"></div>

    <script>
      const webappDiv = document.getElementById('webapp');
      const userDiv = document.getElementById('user');
      const backendDiv = document.getElementById('backend');

      // Show WebApp object
      webappDiv.textContent = JSON.stringify(window.Telegram?.WebApp || {}, null, 2);

      async function load() {
        const tg = window.Telegram?.WebApp;

        // Show user data
        userDiv.textContent = JSON.stringify(tg?.initDataUnsafe || {}, null, 2);

        // Get backend data
        try {
          const res = await fetch('/api/user/profile', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              auth: tg?.initData || '',
            },
            body: JSON.stringify({}),
          });
          const data = await res.json();
          backendDiv.textContent = JSON.stringify(data, null, 2);
        } catch (e) {
          backendDiv.textContent = 'Error: ' + e.message;
        }
      }

      load();
    </script>
  </body>
</html>
